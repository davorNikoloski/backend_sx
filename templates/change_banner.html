<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
</head>
<body>
    <h1>Welcome to the Upload Image Page</h1>
    <form action="/api/misc/update_banner"  method="post" enctype="multipart/form-data">
        <label for="banner">Choose a banner image:</label>
        <input type="file" id="banner" name="banner" accept="image/*">
        <input type="submit" value="Upload">
    </form>
</body>
</html>

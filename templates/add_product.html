<!-- templates/add_product.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Add New Product</title>
    <!-- Add Bootstrap CSS link -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Add New Product</h1>
        <form action="/api/products/create_product" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Име:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="info">Спецификации за продуктот:</label>
                <textarea class="form-control" id="info" name="info" required></textarea>
            </div>

            <div class="form-group">
                <label for="info">Опис на продкутот:</label>
                <textarea class="form-control" id="description" name="description" required></textarea>
            </div>

            <div class="form-group">
                <label for="brand">Бренд:</label>
                <input type="text" class="form-control" id="brand" name="brand" required>
            </div>

            <div>
                <label for="available">Достапно?:</label>
                <select name="available" id="available">
                    <option value=1>Да</option>
                    <option value=0>Не</option>
                </select>
            </div>
            <div class="form-group">
                <label for="price">Цена:</label>
                <input type="number" class="form-control" id="price" name="price" required>
            </div>
            
            <div class="form-group">
                <label for="price_Discount">Цена пред попуст:</label>
                <input type="number" class="form-control" id="price_Discount" name="price_Discount" value=0>
            </div>
            <div>
                <label for="deliveryCost">Достава:</label>
                <select name="deliveryCost" id="deliveryCost">
                    <option value=150>150</option>
                    <option value=0>Бесплатна Достава</option>
                    <option value="custom">Внеси цена</option>

                </select>
                <input type="number" id="customDeliveryCost" name="customDeliveryCost" placeholder="Внеси цена" style="display: none;">

            </div>
            <div class="form-group">
                <label for="productNo">ID на продкут:</label>
                <input type="text" class="form-control" id="productNo" name="productNo" required>
            </div>


            <div class="form-group">
                <label for="productImages">Фотографии за продуктот:</label>
                <input type="file" class="form-control-file" id="productImages" name="product_images[]" multiple accept=".jpg, .jpeg, .png">
            </div>
            <div class="form-group">
                <label for="main_image">Почетна слика на продукт:</label>
                <input type="file" class="form-control-file" id="main_image" name="main_image" accept=".jpg, .jpeg, .png, .gif">
            </div>

            <div class="form-group">
                <label for="productImage">gif за продуктот:</label>
                <input type="file" class="form-control-file" id="productImage" name="product_path" accept=".jpg, .jpeg, .png, .gif">
            </div>

            <div class="form-group" id="specificationSection">
                <h2>Боја,Големина,Нова цена</h2>
                <div class="specification d-none">
                    <div class="form-group">
                        <label for="spec_color">Боја:</label>
                        <input type="text" class="form-control" name="spec_color[]" >
                    </div>
                    <div class="form-group">
                        <label for="spec_size">Големина:</label>
                        <input type="text" class="form-control" name="spec_size[]" >
                    </div>
                    <div class="form-group">
                        <label for="spec_new_price">Нова Цена:</label>
                        <input type="number" class="form-control" name="spec_new_price[]" >
                    </div>
                </div>
                <input type="hidden" name="specificationCounter" id="specificationCounter" value="0">

                <button type="button" class="btn btn-primary" id="addSpecification">Додади спецификација</button>
            </div>
            

            <!-- Category dropdown -->
            <div class="form-group">
                <label for="cid">Категорија:</label>
                <select class="form-control" id="cid" name="cid" required>
                    <option value="" selected disabled>Select Category</option>
                    {% for category in categories %}
                    <option value="{{ category.cid }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Subcategory dropdown -->
            <div class="form-group">
                <label for="scid">Под-категорија:</label>
                <select class="form-control" id="scid" name="scid" required disabled>
                    <option value="" selected disabled>Избери</option>
                    <!-- The options will be populated dynamically using JavaScript -->
                </select>
            </div>

            <!-- Image upload -->
            

            <input type="submit" class="btn btn-primary" value="Add Product">
        </form>
    </div>

    <!-- Add Bootstrap JS and jQuery scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Add JavaScript to dynamically update the subcategory dropdown based on the selected category -->
    <script>
        $(document).ready(function () {
            const subcategoryDropdown = $("#scid");
            const categoryDropdown = $("#cid");
    
            // Get subcategories data from the rendered template
            const subcategoriesData = JSON.parse('{{ subcategories | tojson | safe }}');
    
            categoryDropdown.on("change", function () {
                const selectedCategoryId = $(this).val();
                subcategoryDropdown.empty().prop("disabled", true);
    
                if (selectedCategoryId) {
                    const selectedSubcategories = subcategoriesData[selectedCategoryId];
                    if (selectedSubcategories) {
                        selectedSubcategories.forEach((subcategory) => {
                            const option = $(`<option value="${subcategory.scid}">${subcategory.name}</option>`);
                            if (subcategory.scid) {
                                option.prop('selected', true);
                            }
                            subcategoryDropdown.append(option);
                        });
                        subcategoryDropdown.prop("disabled", false);
                    } else {
                        console.error("No subcategories found for the selected category");
                    }
                }
            });
    
            // Trigger the change event on page load to pre-fill the subcategory
            categoryDropdown.trigger('change');
        });
    </script>
    <script>
        // JavaScript to handle the custom input option
        const deliveryCostSelect = document.getElementById('deliveryCost');
        const customDeliveryCostInput = document.getElementById('customDeliveryCost');
    
        deliveryCostSelect.addEventListener('change', function () {
            const selectedValue = deliveryCostSelect.value;
    
            // If "Внеси сопствена цена" is selected, show the custom input field
            if (selectedValue === 'custom') {
                customDeliveryCostInput.style.display = 'block';
            } else {
                customDeliveryCostInput.style.display = 'none';
            }
        });
    </script>
    <script>
        $(document).ready(function () {
            // Counter to keep track of added specifications
            let specificationCounter = 1;
    
            // Event handler for adding a new specification
            $("#addSpecification").on("click", function () {
                // Clone the existing specification div and update the input names
                const newSpecification = $(".specification:first").clone();
                newSpecification.find("input").each(function () {
                    const currentName = $(this).attr("name");
                    $(this).attr("name", currentName.replace("[]", `[${specificationCounter}]`));
                    $(this).val("");  // Optionally clear the input values
                });
    
                // Increment the counter and update the hidden input field
                specificationCounter++;
                $("#specificationCounter").val(specificationCounter);
    
                // Append the new specification
                $("#specificationSection").append(newSpecification);
    
                // Check if specificationCounter is greater than 1
                if (specificationCounter > 1) {
                    // If specificationCounter is greater than 1, remove the 'd-none' class
                    newSpecification.removeClass("d-none");
                }
            });
        });
    </script>
    
</body>
</html>
